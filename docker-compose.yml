services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${PORT_DB}:${PORT_DB}'
    networks:
      - node-service
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-app
    restart: always
    ports:
      - '${PORT_APP}:${PORT_APP}'
    depends_on:
      - postgres
    volumes:
      - ./src:/usr/src/app/src
    command: npm run start:dev

networks:
  node-service:
    driver: bridge

volumes:
  postgres_data:
